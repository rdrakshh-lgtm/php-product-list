
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Price Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Product Price Calculator</h1>
        <p>Add products and calculate their total price.</p>

        <form id="productForm">
            <label for="productName">Product Name</label>
            <input type="text" id="productName" placeholder="Enter product name" required>

            <label for="productPrice">Product Price (₹)</label>
            <input type="number" id="productPrice" placeholder="Enter price"
                   min="0.01" step="0.01" required>

            <button type="submit">Add Product</button>
        </form>

        <h2>Product List</h2>

        <table>
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Product Price</th>
                </tr>
            </thead>
            <tbody id="productList">
                <tr>
                    <td colspan="2">No products added yet.</td>
                </tr>
            </tbody>
        </table>

        <div class="total">
            Total Price: <span id="totalPrice">₹0.00</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
